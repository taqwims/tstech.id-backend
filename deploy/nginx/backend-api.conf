# Upstream Go API Server
upstream go_backend {
    server 127.0.0.1:8080;
    keepalive 32;
}

# HTTP - Redirect all traffic to HTTPS (akan dikonfigurasi otomatis oleh Certbot)
server {
    listen 80;
    listen [::]:80;
    server_name api.yourdomain.com; # Ganti dengan domain/subdomain API Anda

    # Certbot challenge validation
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Configuration (diaktifkan setelah menjalankan certbot)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.yourdomain.com; # Ganti dengan domain/subdomain API Anda

    # Maximum file upload size (sesuaikan untuk upload file/gambar)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Timeouts
    proxy_connect_timeout 90s;
    proxy_send_timeout 90s;
    proxy_read_timeout 90s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/json application/xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Proxy to Go API backend
    location / {
        proxy_pass http://go_backend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for real-time responsiveness
        proxy_buffering off;
        proxy_cache_bypass $http_upgrade;
    }

    # Optional: Serve local uploaded static files directly via Nginx
    location /uploads/ {
        alias /var/www/kotban/backend/uploads/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        try_files $uri =404;
    }
}
